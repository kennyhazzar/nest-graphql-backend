log:
  level: warn
  colorize: false

settings:
  language: ru
  locale: ru-RU
  country: RU

admin:
  email: admin@test.com
  password: Test_Password1!

host:
  hostname: localhost
  port: 3001
  origin: http://localhost:3001
  environment: testing

graphql:
  graphiql: true
  introspection: true
  path: /graphql

database:
  type: postgres
  username: postgres
  password: 12345678
  host: localhost
  port: 5432
  db: template_test
  ssl: false
  dropSchema: true

redis:
  host: localhost
  port: 6379
  password:

jwt:
  algorithmJwt: HS256
  algorithm: SHA512
  access:
    token: test-access-token-secret
    expires: 1day
    jwtAlgorithm: HS256
  refresh:
    token: test-refresh-token-secret
    expires: 15days
    jwtAlgorithm: HS512

# Authentication configuration for testing
auth:
  mode: HYBRID
  csrf:
    enabled: false  # Disabled for easier testing
  cookies:
    accessToken:
      name: accessToken
      httpOnly: true
      secure: false
      sameSite: lax
      maxAge: 86400000  # 1 day (86400000ms) - matches JWT expires
    refreshToken:
      name: refreshToken
      httpOnly: true
      secure: false
      sameSite: lax
      maxAge: 1296000000  # 15 days (1296000000ms)
    csrf:
      name: csrf-token
      httpOnly: false
      secure: false
      sameSite: lax
      maxAge: 1296000000  # 15 days (1296000000ms)
