networks:
  default:
    driver: bridge

volumes:
  postgres:
  redis:

services:
  postgres:
    image: bitnami/postgresql:17
    restart: 'on-failure'
    environment:
      POSTGRESQL_USER: postgres
      POSTGRESQL_PASSWORD: 12345678
      POSTGRESQL_POSTGRES_PASSWORD: 12345678
      POSTGRESQL_DATABASE: template
      TZ: Europe/Moscow
    volumes:
      - postgres:/bitnami/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d template -U postgres']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8-alpine
    restart: 'on-failure'
    volumes:
      - redis:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
